<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>佛学课堂游戏中心</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="page">
  <h1 class="title">🪷 佛学课堂游戏中心 🪷</h1>
  <p class="subtitle">选择一个游戏，和全班同学一起玩吧。分数会在每个游戏之间累计——请留意屏幕底部的计分栏。</p>

  <div class="game-grid">
    <a class="game-card" href="quiz.html">
      <div class="icon">❓</div>
      <h3>智慧问答大赛</h3>
      <p>类似"危险边缘"的问答板。选择一个类别和分值，各队抢答。</p>
    </a>
    <a class="game-card" href="truefalse.html">
      <div class="icon">⚡</div>
      <h3>是非快问快答</h3>
      <p>关于佛陀和他的教导的快节奏问答。判断对错！</p>
    </a>
    <a class="game-card" href="timeline.html">
      <div class="icon">📜</div>
      <h3>佛陀生平时间轴</h3>
      <p>一起把佛陀一生中的重要事件按正确的顺序排列出来。</p>
    </a>
    <a class="game-card" href="wheel.html">
      <div class="icon">🎡</div>
      <h3>幸运转盘</h3>
      <p>随机抽选队伍、发放额外分数，或决定下一个回答问题的人。</p>
    </a>
    <a class="game-card" href="scoreboard.html">
      <div class="icon">🏆</div>
      <h3>队伍计分板</h3>
      <p>课前设置好队伍，或在课程结束时展示最终分数。</p>
    </a>
  </div>

  <footer class="hint">小提示：在教室的电脑上打开此页面并投影出来——不需要联网。</footer>
</div>
<script src="js/scoreboard.js"></script>
</body>
</html>
