<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>是非快问快答</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .card {
    background: var(--panel);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px 30px;
    max-width: 760px;
    width: 100%;
    text-align: center;
    margin-top: 10px;
  }
  .counter { color: var(--maroon-dark); font-weight: 700; margin-bottom: 6px; }
  .statement { font-size: 2rem; color: var(--ink); margin: 20px 0 26px; min-height: 3.4em; display:flex; align-items:center; justify-content:center; }
  .choice-row { display: flex; gap: 20px; justify-content: center; margin-bottom: 20px; }
  .choice-btn {
    font-size: 1.6rem; font-weight: 900; padding: 20px 50px; border-radius: 16px;
    border: none; cursor: pointer; color: white; box-shadow: var(--shadow);
  }
  .choice-btn.true-btn { background: var(--green-ok); }
  .choice-btn.false-btn { background: var(--red-no); }
  .choice-btn:hover { filter: brightness(1.08); transform: translateY(-2px); }
  .result { font-size: 1.4rem; font-weight: 800; min-height: 1.6em; margin: 10px 0; }
  .result.correct-text { color: var(--green-ok); }
  .result.wrong-text { color: var(--red-no); }
  .explain { font-size: 1rem; color: #6a5748; min-height: 1.6em; }
  .nav-row { display: flex; gap: 14px; justify-content: center; margin-top: 20px; }
</style>
</head>
<body data-page="truefalse">
<div id="site-nav"></div>
<div class="page">
  <h1 class="title">⚡ 是非快问快答</h1>
  <p class="subtitle">大声朗读句子。各队喊出"对！"或"错！"——点击大家一致同意的答案。</p>

  <div class="card">
    <div class="counter" id="counter"></div>
    <div class="statement" id="statement"></div>
    <div class="choice-row" id="choice-row">
      <button class="choice-btn true-btn" id="true-btn">对</button>
      <button class="choice-btn false-btn" id="false-btn">错</button>
    </div>
    <div class="result" id="result"></div>
    <div class="explain" id="explain"></div>
    <div class="nav-row">
      <button class="btn secondary" id="prev-btn">&larr; 上一题</button>
      <button class="btn" id="next-btn">下一题 &rarr;</button>
      <button class="btn ghost" id="shuffle-btn">随机打乱</button>
    </div>
  </div>
</div>

<script src="data/truefalse-data.js"></script>
<script src="js/scoreboard.js"></script>
<script src="js/save.js"></script>
<script src="js/nav.js"></script>
<script src="js/truefalse.js"></script>
</body>
</html>
