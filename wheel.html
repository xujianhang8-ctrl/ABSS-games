<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>幸运转盘</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .wheel-wrap { position: relative; width: min(420px, 90vw); margin: 20px auto 10px; }
  canvas#wheel-canvas { width: 100%; height: auto; display: block; }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 28px solid var(--maroon); z-index: 5;
  }
  textarea#segments-input {
    width: 100%; max-width: 500px; min-height: 140px; font-family: inherit; font-size: 1rem;
    padding: 12px; border-radius: 10px; border: 2px solid #e8c98a; resize: vertical;
  }
  .two-col { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; margin-top: 10px; width: 100%; max-width: 1000px; }
  .col { flex: 1; min-width: 300px; text-align: center; }
  .result-banner {
    font-size: 1.6rem; font-weight: 900; color: var(--maroon); min-height: 2em; margin-top: 10px;
  }
  .preset-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
</style>
</head>
<body>
<div class="top-nav"><a href="index.html" class="btn ghost small">&larr; 返回首页</a></div>
<div class="page">
  <h1 class="title">🎡 幸运转盘</h1>
  <p class="subtitle">用它来随机抽选队伍、决定下一个回答问题的人，或发放一个惊喜奖励。</p>

  <div class="two-col">
    <div class="col">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel-canvas" width="420" height="420"></canvas>
      </div>
      <button class="btn" id="spin-btn">开始转动！</button>
      <div class="result-banner" id="result-banner"></div>
    </div>
    <div class="col">
      <h3>转盘选项（每行一项）</h3>
      <textarea id="segments-input"></textarea>
      <div class="preset-row">
        <button class="btn small secondary" id="load-teams-btn">载入当前队伍</button>
        <button class="btn small ghost" id="load-bonus-btn">载入奖励预设</button>
        <button class="btn small" id="apply-btn">更新转盘</button>
      </div>
    </div>
  </div>
</div>

<script src="js/scoreboard.js"></script>
<script src="js/gamestate.js"></script>
<script src="js/menu.js"></script>
<script src="js/wheel.js"></script>
</body>
</html>
